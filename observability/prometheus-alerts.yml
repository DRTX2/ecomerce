groups:
  - name: commerce-api
    rules:
      - alert: CommerceApiUnavailable
        expr: up{job="commerce-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Commerce API is unavailable
      - alert: CommerceApiHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="commerce-api",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="commerce-api"}[5m])) > 0.005
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Commerce API 5xx rate exceeds 0.5 percent
      - alert: CommerceApiWriteLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="commerce-api",uri=~"/api/v1/(carts|orders).*"}[5m]))) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Commerce write p95 latency exceeds 800ms
